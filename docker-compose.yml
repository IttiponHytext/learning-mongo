services:
  mongo:
    image: mongo:7
    container_name: mongo-learning
    # รันเป็น replica set 1 โหนด เพื่อให้ใช้ Transactions ได้ (บทที่ 9)
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # init replica set อัตโนมัติครั้งแรก
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-learning-ui
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?directConnection=true
      ME_CONFIG_BASICAUTH: "false"

volumes:
  mongo-data:
